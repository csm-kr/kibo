<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도우하우스 피자 키오스크</title>
<!-- Black-box kiosk: built independently of KIBO. No API, no data export, partly non-semantic markup like many real kiosks. -->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #faf6f0; }
  .screen { display: none; padding: 24px; } .screen.on { display: block; }
  .tile { display: inline-block; width: 180px; margin: 8px; padding: 16px; background: #fff; border-radius: 12px; cursor: pointer; }
  .tabs span { padding: 10px 18px; margin-right: 6px; background: #eee; border-radius: 20px; cursor: pointer; }
  .tabs span.sel { background: #c0392b; color: #fff; }
  .modal, .popup { display: none; position: fixed; inset: 10% 20%; background: #fff; padding: 24px; border: 2px solid #333; overflow: auto; }
  .modal.on, .popup.on { display: block; }
  .err { color: #c0392b; min-height: 1em; }
  #cartbar { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 12px; }
</style>
</head>
<body>
<div class="screen on" id="home"><h1>도우하우스</h1><div class="tile" id="startBtn">화면을 터치하여 주문을 시작하세요</div></div>

<div class="screen" id="where"><h2>어디서 드시나요?</h2>
  <div class="tile" data-where="매장">🍽 먹고 갈게요</div><div class="tile" data-where="포장">🛍 가져갈게요</div></div>

<div class="screen" id="menu">
  <div class="tabs" id="tabs"></div>
  <div id="items"></div>
</div>

<div class="screen" id="pay"><h2>결제 방법을 선택하세요</h2><div class="tile" id="cardPay">💳 신용/체크카드</div><div id="done"></div></div>

<div class="modal" id="opt" role="dialog" aria-label="옵션 선택">
  <h3 id="optTitle"></h3><div id="optBody"></div>
  <div>수량 <button id="minus">−</button> <span id="qty">1</span> <button id="plus">+</button></div>
  <p class="err" id="optErr"></p>
  <button id="addBtn">장바구니 담기</button> <button id="cancelBtn">닫기</button>
</div>

<div class="popup" id="upsell" role="dialog" aria-label="추천"><p>사이드 메뉴도 함께 드시겠어요? 갈릭디핑소스가 인기예요!</p>
  <button id="upNo">아니요, 괜찮아요</button> <button id="upYes">사이드 보러가기</button></div>

<div id="cartbar">장바구니 <span id="cartCount">0</span>개 · 합계 <span id="cartTotal">0</span>원
  <ul id="cartList"></ul><button id="checkout">주문하기</button></div>

<script>
const MENU = {
  '피자': [
    { name: '마르게리따', price: 15900, groups: 'pizza' },
    { name: '페퍼로니', price: 17900, groups: 'pizza' },
    { name: '불고기 피자', price: 19900, groups: 'pizza' },
    { name: '포테이토 피자', price: 19900, groups: 'pizza', soldOut: true },
  ],
  '사이드': [
    { name: '치즈 오븐 스파게티', price: 6900 },
    { name: '갈릭디핑소스', price: 500 },
    { name: '버팔로 윙 6조각', price: 7900 },
  ],
  '음료': [
    { name: '콜라', price: 2000, groups: 'drink' },
    { name: '제로콜라', price: 2000, groups: 'drink' },
    { name: '사이다', price: 2000, groups: 'drink' },
  ],
};
const GROUPS = {
  pizza: [
    { title: '사이즈 (필수)', type: 'radio', required: true, opts: [['레귤러', 0], ['라지', 4000]] },
    { title: '도우 (필수)', type: 'radio', required: true, opts: [['오리지널', 0], ['씬', 0], ['치즈크러스트', 3000]] },
    { title: '토핑 추가 (최대 3개)', type: 'check', max: 3, opts: [['베이컨', 1500], ['올리브', 800], ['옥수수', 800], ['더블치즈', 2000], ['할라피뇨', 800]] },
  ],
  drink: [{ title: '용량 (필수)', type: 'radio', required: true, opts: [['500ml', 0], ['1.25L', 1300]] }],
};
const $ = (id) => document.getElementById(id);
const cart = []; let where = null; let cur = null; let qty = 1; let upsellShown = false;
const show = (id) => { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); };

$('startBtn').onclick = () => show('where');
document.querySelectorAll('[data-where]').forEach((t) => t.onclick = () => { where = t.dataset.where; show('menu'); tab('피자'); });

function tab(cat) {
  $('tabs').innerHTML = Object.keys(MENU).map((c) => `<span class="${c === cat ? 'sel' : ''}">${c}</span>`).join('');
  [...$('tabs').children].forEach((s) => s.onclick = () => tab(s.textContent));
  $('items').innerHTML = MENU[cat].map((m, i) => `<div class="tile" data-i="${i}">${m.name}<br>${m.price.toLocaleString()}원${m.soldOut ? '<br><b>품절</b>' : ''}</div>`).join('');
  [...$('items').children].forEach((el) => el.onclick = () => openItem(MENU[cat][el.dataset.i], cat));
}

function openItem(m, cat) {
  if (m.soldOut) { alert('품절된 메뉴입니다'); return; }
  cur = { m, cat }; qty = 1; $('qty').textContent = 1; $('optErr').textContent = '';
  $('optTitle').textContent = `${m.name} ${m.price.toLocaleString()}원`;
  const gs = GROUPS[m.groups] || [];
  $('optBody').innerHTML = gs.map((g, gi) => `<fieldset><legend>${g.title}</legend>` + g.opts.map(([n, p]) =>
    `<label><input type="${g.type === 'radio' ? 'radio' : 'checkbox'}" name="g${gi}" value="${n}" data-p="${p}"> ${n}${p ? ` (+${p.toLocaleString()}원)` : ''}</label>`).join(' ') + '</fieldset>').join('');
  $('optBody').querySelectorAll('input[type=checkbox]').forEach((cb) => cb.onchange = () => {
    const g = gs[Number(cb.name.slice(1))];
    if ($('optBody').querySelectorAll(`input[name=${cb.name}]:checked`).length > g.max) { cb.checked = false; $('optErr').textContent = `토핑은 최대 ${g.max}개까지 선택할 수 있어요`; }
  });
  $('opt').classList.add('on');
}
$('plus').onclick = () => { qty++; $('qty').textContent = qty; };
$('minus').onclick = () => { qty = Math.max(1, qty - 1); $('qty').textContent = qty; };
$('cancelBtn').onclick = () => $('opt').classList.remove('on');
$('addBtn').onclick = () => {
  const gs = GROUPS[cur.m.groups] || []; const picked = []; let extra = 0;
  for (let gi = 0; gi < gs.length; gi++) {
    const sel = [...$('optBody').querySelectorAll(`input[name=g${gi}]:checked`)];
    if (gs[gi].required && sel.length === 0) { $('optErr').textContent = `${gs[gi].title.replace(' (필수)', '')}을(를) 선택해 주세요`; return; }
    sel.forEach((s) => { picked.push(s.value); extra += Number(s.dataset.p); });
  }
  cart.push({ name: cur.m.name, opts: picked, qty, price: (cur.m.price + extra) * qty });
  $('opt').classList.remove('on'); renderCart();
  if (cur.cat === '피자' && !upsellShown) { upsellShown = true; $('upsell').classList.add('on'); }
};
$('upNo').onclick = () => $('upsell').classList.remove('on');
$('upYes').onclick = () => { $('upsell').classList.remove('on'); tab('사이드'); };
function renderCart() {
  $('cartCount').textContent = cart.reduce((a, c) => a + c.qty, 0);
  $('cartTotal').textContent = cart.reduce((a, c) => a + c.price, 0).toLocaleString();
  $('cartList').innerHTML = cart.map((c, i) => `<li>${c.name}${c.opts.length ? ` (${c.opts.join(', ')})` : ''} x${c.qty} ${c.price.toLocaleString()}원 <button data-del="${i}">삭제</button></li>`).join('');
  $('cartList').querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { cart.splice(Number(b.dataset.del), 1); renderCart(); });
}
$('checkout').onclick = () => { if (cart.length) show('pay'); };
$('cardPay').onclick = () => { $('done').textContent = `카드를 투입구에 넣어주세요 (${where})`; };
</script>
</body>
</html>
