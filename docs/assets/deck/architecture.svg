<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="arch-title" viewBox="0 0 1000 424" xmlns="http://www.w3.org/2000/svg" width="1000" height="424" font-family="'IBM Plex Sans KR', 'Helvetica Neue', Arial, sans-serif"><title id="arch-title">Architecture: the phone talks to Gemini Live directly and sends commands to Cloud Run; the kiosk sends cart changes and card actions to Cloud Run; Cloud Run writes Firestore in transactions, streams each change back to the phone and the kiosk, issues pinned Live tokens, runs the Gemini Flash text agent and reads the API key from Secret Manager.</title><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"></path></marker></defs><rect width="1000" height="424" fill="#FFFFFF"></rect><g><rect x="24" y="40" width="184" height="96" rx="14" fill="#FBF7EF" stroke="#15171C" stroke-width="2"></rect><text x="116" y="74" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Phone</text><text x="116" y="100" text-anchor="middle" font-size="16" fill="#33302B">/assistant</text></g><g><rect x="24" y="296" width="184" height="96" rx="14" fill="#FBF7EF" stroke="#15171C" stroke-width="2"></rect><text x="116" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Kiosk</text><text x="116" y="356" text-anchor="middle" font-size="16" fill="#33302B">/kiosk</text></g><g><rect x="360" y="104" width="200" height="256" rx="14" fill="#EEF0FD" stroke="#15171C" stroke-width="2"></rect><text x="460" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Cloud Run</text><text x="460" y="164" text-anchor="middle" font-size="16" fill="#33302B">Next.js app + API</text><text x="460" y="186" text-anchor="middle" font-size="16" fill="#33302B">asia-northeast3</text></g><g><rect x="800" y="24" width="176" height="72" rx="14" fill="#EEF0FD" stroke="#15171C" stroke-width="2"></rect><text x="888" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Gemini Live</text></g><g><rect x="800" y="128" width="176" height="72" rx="14" fill="#EEF0FD" stroke="#15171C" stroke-width="2"></rect><text x="888" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Gemini Flash</text></g><g><rect x="800" y="232" width="176" height="72" rx="14" fill="#EEF0FD" stroke="#15171C" stroke-width="2"></rect><text x="888" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Firestore</text></g><g><rect x="800" y="336" width="176" height="72" rx="14" fill="#EEF0FD" stroke="#15171C" stroke-width="2"></rect><text x="888" y="379" text-anchor="middle" font-size="20" font-weight="700" fill="#15171C">Secret Manager</text></g><line x1="208" y1="60" x2="798" y2="60" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="500" y="50" text-anchor="middle" font-size="16" fill="#33302B">voice, ephemeral token</text><line x1="208" y1="116" x2="358" y2="116" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="284" y="106" text-anchor="middle" font-size="16" fill="#33302B">commands</text><line x1="360" y1="132" x2="210" y2="132" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)" stroke-dasharray="6 6"></line><text x="284" y="154" text-anchor="middle" font-size="16" fill="#33302B">SSE</text><line x1="208" y1="316" x2="358" y2="316" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="284" y="306" text-anchor="middle" font-size="16" fill="#33302B">cart, card</text><line x1="360" y1="332" x2="210" y2="332" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)" stroke-dasharray="6 6"></line><text x="284" y="354" text-anchor="middle" font-size="16" fill="#33302B">SSE</text><line x1="560" y1="124" x2="798" y2="88" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="680" y="128" text-anchor="middle" font-size="16" fill="#33302B">pinned token</text><line x1="560" y1="168" x2="798" y2="168" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="680" y="160" text-anchor="middle" font-size="16" fill="#33302B">text agent</text><line x1="560" y1="256" x2="798" y2="256" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="680" y="248" text-anchor="middle" font-size="16" fill="#33302B">transactions</text><line x1="798" y1="280" x2="562" y2="280" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)" stroke-dasharray="6 6"></line><text x="680" y="302" text-anchor="middle" font-size="16" fill="#33302B">onSnapshot</text><line x1="560" y1="352" x2="798" y2="352" stroke="#15171C" stroke-width="2" marker-end="url(#arch-arrow)"></line><text x="680" y="344" text-anchor="middle" font-size="16" fill="#33302B">API key</text></svg>
