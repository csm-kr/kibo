<!doctype html>
<!-- Shown by public/sw.js when /app opens with no network. Self-contained: no scripts, fonts or other files. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3446D4" />
    <title>KIBO</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        background: #fbf7ef;
        color: #15171c;
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        font-size: 1.25rem;
        line-height: 1.5;
        word-break: keep-all;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        color: #4b463f;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60px;
        border-radius: 18px;
        background: #3446d4;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #15171c;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>인터넷에 연결되어 있지 않아요.</h1>
      <p>연결되면 다시 열어 주세요.</p>
    </section>
    <section lang="en">
      <h1>You're offline.</h1>
      <p>Please open KIBO again once you're connected.</p>
    </section>
    <a href="/app">다시 열기 · <span lang="en">Try again</span></a>
  </body>
</html>
